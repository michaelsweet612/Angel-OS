name: Build & Publish Angel OS Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build production offline bundle
        run: npm run build

      - name: Package portable ZIP artifact
        run: npm run release:zip

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const tag = process.env.INPUT_TAG || process.env.REF_NAME;
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`## ${escaped}[^\\n]*\\n([\\s\\S]*?)(?=\\n---\\n\\n## v|$)`);
            const match = changelog.match(re);
            const body = match ? match[1].trim() : `Angel OS ${tag} release with downloadable portable offline bundle.`;
            fs.writeFileSync("release-notes.md", body + "\n");
          '

      - name: Publish GitHub Release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Angel OS ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          files: releases/Angel-OS-*.zip
          draft: false
          prerelease: false
