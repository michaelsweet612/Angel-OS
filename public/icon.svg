<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#008080"/>
  <!-- Classic 1995 CRT Monitor Bezel -->
  <rect x="16" y="14" width="96" height="76" fill="#c0c0c0" stroke="#000000" stroke-width="4"/>
  <line x1="18" y1="16" x2="110" y2="16" stroke="#ffffff" stroke-width="3"/>
  <line x1="18" y1="16" x2="18" y2="88" stroke="#ffffff" stroke-width="3"/>
  <!-- CRT Screen -->
  <rect x="26" y="24" width="76" height="54" fill="#000080" stroke="#404040" stroke-width="3"/>
  <!-- 4-Color 95 Flag Inside CRT -->
  <rect x="46" y="35" width="16" height="14" fill="#ff3b30"/>
  <rect x="65" y="35" width="16" height="14" fill="#34c759"/>
  <rect x="46" y="52" width="16" height="14" fill="#007aff"/>
  <rect x="65" y="52" width="16" height="14" fill="#ffcc00"/>
  <!-- Power LED -->
  <rect x="96" y="82" width="8" height="4" fill="#00ff66"/>
  <!-- Monitor Stand & Base -->
  <rect x="48" y="90" width="32" height="10" fill="#a0a0a0" stroke="#000000" stroke-width="3"/>
  <rect x="30" y="100" width="68" height="12" fill="#c0c0c0" stroke="#000000" stroke-width="4"/>
  <line x1="32" y1="102" x2="96" y2="102" stroke="#ffffff" stroke-width="2"/>
</svg>
